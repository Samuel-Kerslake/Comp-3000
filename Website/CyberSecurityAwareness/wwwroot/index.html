<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cybersecurity Awareness</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <div id="sidebar">
        <h2>Cybersecurity Awareness</h2>

        <div id="loginIcon" onclick="openLoginModal()" title="Login">
            <span class="user-icon">👤</span>
            <span class="login-text">Login</span>
        </div>

        <ul id="sidebarLinks">
            <!-- Pages load dynamically -->
        </ul>

        <div id="sidebarBottom">
            <button id="settingsBtn" type="button">
                Settings
            </button>
            <button id="accountSettingsBtn" type="button">
                Account
            </button>
        </div>
    </div>

    <div id="content">
        <!-- Pages load dynamically -->
    </div>

    <!-- Dashboard loads only if dashboard page is open -->
    <div id="dashboardTemplate" style="display:none;">
        <div class="dashboard">
            <h1>Dashboard</h1>

            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <h3>Current Level</h3>
                    <p id="dashLevel">Guest</p>
                </div>

                <div class="dashboard-card">
                    <h3>Progress</h3>
                    <div class="progress-bar">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>
                    <p id="progressText">0% complete</p>
                </div>

                <div class="dashboard-card">
                    <h3>Lessons Completed</h3>
                    <p id="lessonsCompleted">0</p>
                </div>

                <div class="dashboard-card">
                    <h3>Accessibility</h3>
                    <p id="accessText">Default</p>
                </div>
            </div>

            <div class="dashboard-card" style="margin-top:20px;">
                <h3>Recommended for you</h3>
                <div id="recommendations">
                    <p>Log in to see recommendations.</p>
                </div>
            </div>
        </div>
    </div>

    <div id="loginModal" class="modal-overlay" aria-hidden="true">
        <div class="modal-box" role="dialog" aria-modal="true">
            <button class="close-btn" onclick="closeLoginModal()" aria-label="Close" type="button">&times;</button>

            <div class="modal-tabs">
                <button id="loginTab" class="active" onclick="switchModalTab('login')" type="button">Login</button>
                <button id="registerTab" onclick="switchModalTab('register')" type="button">Create Account</button>
            </div>

            <div id="loginForm" class="modal-form active">
                <h2>Login</h2>
                <label>Email</label>
                <input type="email" id="loginEmail">
                <label>Password</label>
                <input type="password" id="loginPassword">
                <button onclick="loginUser()" type="button">Login</button>
            </div>

            <div id="registerForm" class="modal-form">
                <h2>Create Account</h2>
                <label>Email</label>
                <input type="email" id="regEmail">
                <label>Password</label>
                <input type="password" id="regPassword">
                <label>Confirm Password</label>
                <input type="password" id="regPassword2">
                <label>Job Title</label>
                <input type="text" id="registerJob">
                <label>Knowledge Level</label>
                <select id="registerKnowledge">
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
                <button onclick="registerUser()" type="button">Create Account</button>
            </div>
        </div>
    </div>

    <script type="module" src="/script.js"></script>
</body>
</html>
